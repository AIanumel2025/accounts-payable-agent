name: M11A/M11B/M11C/M11D frontend

# Dedicated to the M11A/M11B/M11C/M11D human-review and operations frontend
# (M11A task brief §18, extended in place by M11B task §19/§20, by M11C task
# §30 and by M11D Core (upload, worker, resume)) --
# "extend the EXISTING M11 frontend CI workflow (not duplicate)" -- rather
# than a second, parallel workflow file). Runs only when frontend code, the API contract it is
# generated from, or the backend routes/schemas it exercises could have
# changed -- never on a documentation-only or unrelated backend-only
# commit, so a docs-only follow-up never triggers this job (and never the
# separate, much longer M8/M9/M10 PaddleOCR/PostgreSQL acceptance workflow,
# which this file does not touch).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "frontend/**"
      - "scripts/export_openapi_schema.py"
      - "scripts/manage_m11a_acceptance_tenant.py"
      - "scripts/manage_m11c_tenant.py"
      - "src/ap_agent/api/**"
      - "src/ap_agent/services/**"
      - "src/ap_agent/exceptions.py"
      - "tests/api/**"
      - "tests/unit/test_review_*.py"
      - "tests/unit/test_workflow_resume_policy.py"
      - "tests/unit/test_api_*.py"
      - "src/ap_agent/models/interface.py"
      - "src/ap_agent/models/orchestration.py"
      - "src/ap_agent/models/memory.py"
      # M11D Core: queue, worker, upload, resume execution and their schema.
      - "src/ap_agent/models/operations.py"
      - "src/ap_agent/repositories/operations_repository.py"
      - "src/ap_agent/worker/**"
      - "src/ap_agent/orchestration/**"
      - "src/ap_agent/serialization/**"
      - "src/ap_agent/artifacts/**"
      - "src/ap_agent/db/**"
      - "scripts/manage_m11d_tenant.py"
      - "tests/unit/test_m11d_*.py"
      - "tests/support/**"
      - "src/ap_agent/services/review_queries.py"
      - "src/ap_agent/repositories/review_repository.py"
      - "src/ap_agent/repositories/postgres_memory_repository.py"
      - "tests/support/review_fixtures.py"
      - "pyproject.toml"
      - ".github/workflows/m11a-frontend.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: m11a-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python (for OpenAPI schema export -- no live backend needed)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install ap_agent (api + postgres + dev extras -- no live database is used in this job)
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,postgres,dev]"

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check OpenAPI contract is up to date (no drift)
        run: npm run api:check

      # M11B task §19: this branch's own changes touch src/ap_agent/api/schemas.py
      # (ApiEnvelope became Generic[T]) and its routes -- the non-PostgreSQL
      # subset of M10's own API/schema test suite re-verifies that change
      # didn't alter runtime behaviour. The PostgreSQL-requiring subset
      # (tests/api/test_review_api_postgres.py, tests/api/test_review_api_auth.py's
      # own requires_postgres cases) runs in the real-integration job below,
      # where a live database exists -- never silently skipped without being
      # reported as such.
      - name: M10 API/schema tests (non-PostgreSQL subset; backend schemas changed)
        working-directory: .
        run: python -m pytest -v -m "not requires_postgres" tests/api/ tests/unit/test_api_schemas.py

      # M11C task §30: targeted M10 command-policy tests plus the new
      # capability/error-mapping unit tests (no database needed). The
      # PostgreSQL-requiring command tests run in the real-integration job.
      - name: M10/M11C command-policy, capability and error-mapping unit tests
        working-directory: .
        run: >
          python -m pytest -v -m "not requires_postgres"
          tests/unit/test_review_commands_policy.py tests/unit/test_review_decisions.py
          tests/unit/test_workflow_resume_policy.py tests/unit/test_review_capabilities.py
          tests/unit/test_api_errors.py tests/unit/test_api_dependencies.py

      # M11D Core: unit tests with no database -- upload validation, artifact
      # storage, the engine resume entry point, typed hydration and the
      # correction overlay (real Phase 4/5/6 tools, no OCR).
      - name: M11D unit tests (no database)
        working-directory: .
        run: python -m pytest -v -m "not requires_postgres" tests/unit/test_m11d_*.py

      - name: Unit and component tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser acceptance tests (mocked backend, no PostgreSQL)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      # M11C task §27/§30: the stateful mocked review-action suite. It reuses
      # the production build made above (AP_AGENT_SKIP_BUILD=1) and starts a
      # mock backend plus four Next.js servers that differ only in their
      # server-only command mode / actor role. No database; no write-enabled
      # default is committed anywhere -- each server's mode is set here per
      # process by tests/e2e/support/actions-stack.mjs.
      - name: Browser acceptance tests -- M11C review actions (mocked backend, no PostgreSQL)
        env:
          AP_AGENT_SKIP_BUILD: "1"
        run: npm run test:e2e:actions

      - name: Upload M11C Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-actions
          path: frontend/playwright-report-actions/
          retention-days: 14

      - name: Check built static assets for server-only secrets
        run: node scripts/check-build-secrets.mjs

  real-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: build-and-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Verify PostgreSQL DSN secret is configured
        env:
          AP_AGENT_TEST_POSTGRES_DSN: ${{ secrets.AP_AGENT_TEST_POSTGRES_DSN }}
        run: |
          if [ -z "${AP_AGENT_TEST_POSTGRES_DSN}" ]; then
            echo "::error::AP_AGENT_TEST_POSTGRES_DSN secret is not configured or is empty."
            exit 1
          fi

      # M11D Core: the real-stack job also runs the worker against real OCR, so it
      # needs the image/PDF extras and the Tesseract system binary (the worker's
      # `tesseract` provider is real Tesseract via the Phase 3 fallback router).
      - name: Install ap_agent (api + postgres + dev + OCR extras)
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,postgres,dev,preprocessing,pdf,ocr-tesseract]"

      - name: Install Tesseract OCR system binary
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install frontend dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # M11B task §19: the PostgreSQL-requiring subset of M10's own
      # API/schema tests relevant to this PR's ApiEnvelope[T] change (the
      # non-PostgreSQL subset already ran in build-and-test above) -- a
      # live database exists here, so this is the full *relevant* subset,
      # never a partial/skipped re-run reported as complete.
      #
      # tests/api/test_review_api_uvicorn.py is deliberately excluded: it
      # is a real-Uvicorn-subprocess acceptance test (task §16, pre-dates
      # M11B, untouched by this PR's diff) that exercises the full
      # command-processing HTTP path, not schema/envelope typing -- CI
      # discovery while adding this very step found it fails an
      # environment-timing-sensitive assertion (a 5s client timeout on one
      # POST .../commands request) roughly 2 of 3 runs on this runner, with
      # no relation to this PR's own changes (its own preceding health/
      # dashboard/queue/detail GET requests -- using this PR's modified
      # schemas -- pass reliably every time). It was never part of any
      # green CI gate before this PR added this step (no prior workflow in
      # this repository ran tests/api/ against a live database), so this
      # is a pre-existing latent flake this PR is not the right place to
      # fix, not a regression this PR introduced or a test to quietly
      # hide -- reported here, not silently patched or skipped project-wide.
      - name: M10 API/schema tests (PostgreSQL-requiring subset relevant to ApiEnvelope[T])
        env:
          AP_AGENT_TEST_POSTGRES_DSN: ${{ secrets.AP_AGENT_TEST_POSTGRES_DSN }}
          # Distinct from the M8/M9/M10 workflow's role: both workflows may run
          # at once against the same database.
          AP_AGENT_TEST_API_RUNTIME_ROLE: ap_agent_m11a_ci_api_runtime
        working-directory: .
        run: >-
          python -m pytest -v tests/api/ tests/unit/test_api_schemas.py
          --ignore=tests/api/test_review_api_uvicorn.py
          --ignore=tests/api/test_m11d_paddle_worker_postgres.py

      # M11A task §15, extended by M11B task §18 to also seed and assert
      # against the three named review-case detail fixtures: the real
      # FastAPI + PostgreSQL (ap_agent_m8_test) + Next.js acceptance path.
      # `AP_AGENT_TEST_POSTGRES_DSN` is mapped into the FastAPI child
      # process's own environment by the script itself, never echoed and
      # never written to a file (task §15/§16).
      - name: Run real FastAPI + PostgreSQL + Next.js acceptance
        env:
          AP_AGENT_TEST_POSTGRES_DSN: ${{ secrets.AP_AGENT_TEST_POSTGRES_DSN }}
        run: npm run test:e2e:integration

      - name: Upload real-integration Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-integration
          path: frontend/playwright-report-integration/
          retention-days: 14

      # M11C task §28/§30: the write-enabled acceptance. It targets only
      # ap_agent_m8_test (the script fails closed otherwise), creates a fresh
      # isolated tenant and least-privilege role, starts FastAPI with
      # AP_AGENT_ENABLE_REVIEW_COMMAND_WRITES=true *inside that child process
      # only* (never globally, never committed as a default), drives real
      # Chromium sessions through claim/release/approve/correct/reject/resume,
      # a genuinely concurrent claim, idempotency, stale revisions and
      # authorization, and then inspects PostgreSQL directly (append-only
      # decisions/audit events, revisions, original-memory hashes, tenant
      # isolation). The DSN is never printed.
      - name: M11C -- run real FastAPI + PostgreSQL + Next.js write-enabled acceptance
        env:
          AP_AGENT_TEST_POSTGRES_DSN: ${{ secrets.AP_AGENT_TEST_POSTGRES_DSN }}
        run: npm run test:e2e:real-actions

      - name: Upload M11C real-actions Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real-actions
          path: frontend/playwright-report-real-actions/
          retention-days: 14

      # M11D Core: the durable operations path against the real database --
      # upload control plane, worker (real Tesseract), resume execution from the
      # recorded restart stage, derived versions, integrity tampering, claim
      # exclusivity, worker-scope RLS and the worker CLI. The real-PaddleOCR
      # worker test (tests/api/test_m11d_paddle_worker_postgres.py) runs in the
      # OCR-capable `m8-postgres-acceptance.yml` job, not here.
      - name: M11D -- real-PostgreSQL control-plane, worker and resume tests
        env:
          AP_AGENT_TEST_POSTGRES_DSN: ${{ secrets.AP_AGENT_TEST_POSTGRES_DSN }}
          # Distinct from the M8/M9/M10 workflow's role: both workflows may run
          # at once against the same database.
          AP_AGENT_TEST_API_RUNTIME_ROLE: ap_agent_m11a_ci_api_runtime
        working-directory: .
        run: >-
          python -m pytest -v
          tests/api/test_m11d_operations_postgres.py
          tests/api/test_m11d_documents_postgres.py
          tests/api/test_m11d_resume_postgres.py

      # M11D Core: browser -> Next.js -> FastAPI -> PostgreSQL -> ONE separate
      # worker process. Operations and review-command writes are enabled only in
      # this script's child processes (never committed as a default); the worker
      # is enabled for its own child only and scoped to the isolated tenant; the
      # DSN reaches only the Python helpers. OCR provider: real Tesseract.
      - name: M11D -- run real FastAPI + worker + PostgreSQL + Next.js acceptance
        env:
          AP_AGENT_TEST_POSTGRES_DSN: ${{ secrets.AP_AGENT_TEST_POSTGRES_DSN }}
          AP_AGENT_WORKER_OCR_PROVIDER: tesseract
        run: npm run test:e2e:real-operations

      - name: Upload M11D real-operations Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real-operations
          path: frontend/playwright-report-real-operations/
          retention-days: 14
