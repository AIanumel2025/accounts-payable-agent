# Disposable local/CI PostgreSQL for Phase 7 operational memory (M8 task
# §9). Development/test infrastructure only -- production deployments use
# an externally managed PostgreSQL service (see
# docs/m8_phase_7_postgres_memory_report.md, "Production deployment
# boundaries"). Not exposed publicly by default: the `postgres` service's
# published port is bound to localhost only.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ap_agent
    volumes:
      - ap_agent_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to localhost only -- never published on all interfaces.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ap_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AP_AGENT_POSTGRES_MIGRATION_DSN: postgresql://ap_agent_migrator:ap_agent_migrator_dev_password@postgres:5432/ap_agent?sslmode=disable
      AP_AGENT_POSTGRES_RUNTIME_ROLE: ap_agent_app
    command: ["python", "scripts/migrate.py", "--allow-migration-dsn-fallback"]

  memory-smoke-test:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Runtime application role: NOT superuser, NOT bypassrls (task §5).
      AP_AGENT_POSTGRES_DSN: postgresql://ap_agent_app:ap_agent_app_dev_password@postgres:5432/ap_agent?sslmode=disable
    command: ["python", "scripts/memory_smoke_test.py"]
    profiles:
      - smoke-test

volumes:
  ap_agent_postgres_data:
    # Persistent development volume (task §9). Never mounted into the
    # application image (Dockerfile has no VOLUME/COPY referencing it).
