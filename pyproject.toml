[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-agent"
version = "0.2.0"
description = "Accounts Payable Agent: modular contracts and pipeline extracted from the validated Phase 1-5 notebook."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    # M11E: mocked S3 service for the storage contract tests (test-only).
    "moto[s3,server]>=5,<6",
    # M11E: static check of the Render Blueprint (scripts/verify_render_blueprint.py).
    "PyYAML>=6,<7",
]
pdf = [
    # PyMuPDF. Pinned to the version recorded in the notebook run
    # (docs/modularisation_map.md §8.1); imported lazily by
    # ap_agent.tools.preprocessing.render_pdf_pages.
    "pymupdf==1.28.2",
]
preprocessing = [
    "pymupdf==1.28.2",
    # Versions unrecorded in the notebook (§8.1/R-06); pinned here to the
    # versions verified during M4A (docs/m4_phase_2_preprocessing_report.md).
    "numpy>=2,<3",
    "opencv-python-headless>=4,<5",
    "Pillow>=12,<13",
]
ocr-tesseract = [
    # Requires the system `tesseract-ocr` binary (5.3.4 in the notebook
    # run); imported lazily by ap_agent.adapters.tesseract_adapter.
    "pytesseract>=0.3,<0.4",
]
ocr-paddle = [
    # Pinned to the exact versions recorded in the notebook run
    # (docs/modularisation_map.md §8.1); imported lazily by
    # ap_agent.adapters.paddleocr_adapter. Downloads OCR models over the
    # network on first engine construction (not at import time).
    "paddlepaddle==3.3.1",
    "paddleocr==3.7.0",
]
postgres = [
    # Phase 7 operational memory (M8). Pinned to the major version range
    # recorded in the notebook run ("PHASE 7 — CELL 2":
    # `%pip install -q "psycopg[binary]>=3.2,<4"`); imported lazily by
    # ap_agent.db.connection / ap_agent.repositories.postgres_memory_repository,
    # never at module import time.
    "psycopg[binary]>=3.2,<4",
    "psycopg_pool>=3.2,<4",
]
api = [
    # Phase 9 human-review interface (M10). Version ranges match the
    # notebook's own Phase 9 Cell 9 install ("fastapi>=0.115,<1.0",
    # "uvicorn>=0.34,<1.0", "httpx>=0.28,<1.0"); the exact versions
    # resolved and verified during M10 are recorded in
    # docs/m10_phase_9_review_api_report.md. `httpx` is needed only by
    # `fastapi.testclient.TestClient`/tests, never imported by
    # `ap_agent.api` itself. Pydantic already ships as a core dependency
    # above; FastAPI pulls in the matching pydantic-core/typing-extensions
    # versions it needs on its own.
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    "httpx>=0.28,<1.0",
    # M11D Core: multipart/form-data parsing for the upload route
    # (`starlette.requests.Request.form`). Imported lazily by Starlette.
    "python-multipart>=0.0.9",
    # M11E: independent verification of Clerk session tokens (RS256) in
    # FastAPI. Imported lazily, only when a token is verified.
    "PyJWT[crypto]>=2.8,<3",
]
s3 = [
    # M11E: S3-compatible object storage (Cloudflare R2). Imported lazily by
    # ap_agent.artifacts.s3.build_s3_client. 1.36+ is required for the
    # explicit checksum-calculation settings R2 needs.
    "boto3>=1.36,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: fast, dependency-isolated test",
    "integration: exercises more than one module or a real fixture",
    "slow: long-running test",
    "ocr: exercises a real local OCR provider (Tesseract and/or PaddleOCR)",
    "requires_fixtures: needs the committed invoice fixtures",
    "requires_tesseract: needs a local Tesseract OCR installation",
    "requires_paddle: needs a local PaddleOCR/PaddlePaddle installation",
    "requires_postgres: needs a live PostgreSQL instance reachable via AP_AGENT_POSTGRES_DSN",
]
