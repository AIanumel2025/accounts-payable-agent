[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-agent"
version = "0.2.0"
description = "Accounts Payable Agent: modular contracts and pipeline extracted from the validated Phase 1-5 notebook."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "requires_fixtures: needs the committed invoice fixtures",
    "requires_tesseract: needs a local Tesseract OCR installation",
    "requires_paddle: needs a local PaddleOCR/PaddlePaddle installation",
    "slow: long-running test",
]
