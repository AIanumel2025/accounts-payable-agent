AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Accounts payable agent -- cost-optimised serverless AWS deployment (M11E.1).
  Public Next.js frontend (Lambda + Function URL), IAM-protected FastAPI (Lambda + AWS_IAM Function URL),
  SQS FIFO-triggered PaddleOCR worker, private S3 invoice bucket and a non-public migration task.
  PostgreSQL stays on Neon, Clerk stays the identity provider. No VPC, NAT, load balancer, RDS or always-on compute.

# Two-pass deployment: the frontend's own URL does not exist until the stack does, and FastAPI / S3 CORS need it.
# Pass 1 leaves FrontendOrigin empty (API fails closed: no Clerk authorized party), pass 2 sets it.
# See docs/m11e1_aws_deployment_runbook.md.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedPattern: "^[a-z][a-z0-9-]{1,14}$"
    Description: Environment name; used in resource names and the Environment tag.
  WebImageUri:
    Type: String
    Description: ECR image URI of the frontend (docker/web.lambda.Dockerfile).
  ApiImageUri:
    Type: String
    Description: ECR image URI of the API (docker/api.lambda.Dockerfile).
  WorkerImageUri:
    Type: String
    Description: ECR image URI of the OCR worker (docker/worker.lambda.Dockerfile).
  MigrateImageUri:
    Type: String
    Description: ECR image URI of the migration task (docker/migrate.lambda.Dockerfile).
  SsmPrefix:
    Type: String
    Default: /ap-agent/production
    AllowedPattern: "^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$"
    Description: >-
      Prefix of the SSM SecureString parameters (created by deploy/aws/scripts/create-secrets.sh, never by this
      template): postgres-runtime-dsn, postgres-migration-dsn, clerk-secret-key, frontend-csrf-secret.
  ClerkPublishableKey:
    Type: String
    AllowedPattern: "^pk_(test|live)_[A-Za-z0-9+/=_-]{8,}$"
    Description: Clerk PUBLISHABLE key. Public by design (it is inlined into the browser bundle); not a secret.
  ClerkIssuer:
    Type: String
    AllowedPattern: "^https://[A-Za-z0-9.-]+$"
    Description: Clerk Frontend API / issuer URL, e.g. https://example.clerk.accounts.dev
  FrontendOrigin:
    Type: String
    Default: ""
    AllowedPattern: "^(https://[A-Za-z0-9.-]+)?$"
    Description: >-
      Origin of the deployed frontend (the `FrontendUrl` output without the trailing slash). Empty on pass 1; set it on
      pass 2. Used as the Clerk authorized party and as the only S3 CORS origin.
  PostgresRuntimeRole:
    Type: String
    Default: ap_agent_app
    AllowedPattern: "^[a-z_][a-z0-9_]{0,62}$"
    Description: Name of the least-privilege runtime database role the migration task grants schema access to (not a secret).
  WorkerMemoryMb:
    Type: Number
    Default: 8192
    MinValue: 4096
    MaxValue: 10240
    Description: >-
      Worker memory (Lambda CPU scales with memory: ~1 vCPU per 1,769 MB). 4096 MB was the starting point; the benchmark
      measured per-job peak resident sets of 1.1-6.8 GB (the largest on a 15 KB PDF), so the default is 8192 MB
      (docs/m11e1_aws_go_live_report.md). The Lambda maximum is 10240 MB.
  WorkerEphemeralStorageMb:
    Type: Number
    Default: 3072
    MinValue: 1024
    MaxValue: 10240
    Description: Scratch space (/tmp) for the downloaded invoice and rendered page images.
  WebAndApiReservedConcurrency:
    Type: Number
    Default: -1
    MinValue: -1
    MaxValue: 100
    Description: >-
      OPTIONAL cap on concurrent executions for each of the frontend and the API (bounds Neon connections and cost).
      -1 (the default) reserves nothing, so no quota increase is needed to deploy. Lambda requires an account to keep
      100 units of unreserved concurrency, so setting a value N is only possible when the account's concurrency quota is
      at least 100 + 2 x N (e.g. 120 for N=10); Lambda rejects the deployment otherwise.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30]
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional e-mail address subscribed to the alarm topic (confirmation required). Leave empty for no subscription.

Conditions:
  ReserveWebAndApiConcurrency: !Not [!Equals [!Ref WebAndApiReservedConcurrency, -1]]
  HasFrontendOrigin: !Not [!Equals [!Ref FrontendOrigin, ""]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Globals:
  Function:
    Architectures: [x86_64]
    Tags:
      Project: accounts-payable-agent
      Environment: !Ref Environment
      ManagedBy: cloudformation

Resources:
  # ------------------------------------------------------------------ object storage
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Explicit name (account + region make it globally unique) so functions and CORS can refer to it
      # without creating a dependency cycle with the frontend URL.
      BucketName: !Sub "ap-agent-${Environment}-uploads-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-abandoned-staged-uploads
            Status: Enabled
            Prefix: staging/
            ExpirationInDays: 1
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration: !If
        - HasFrontendOrigin
        - CorsRules:
            - AllowedOrigins: [!Ref FrontendOrigin]
              AllowedMethods: [POST]
              AllowedHeaders: [content-type]
              ExposedHeaders: [ETag]
              MaxAge: 600
        - !Ref AWS::NoValue
      Tags:
        - { Key: Project, Value: accounts-payable-agent }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: cloudformation }

  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt UploadBucket.Arn
              - !Sub "${UploadBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # ------------------------------------------------------------------ queue
  JobsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "ap-agent-${Environment}-jobs-dlq.fifo"
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - { Key: Project, Value: accounts-payable-agent }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: cloudformation }

  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "ap-agent-${Environment}-jobs.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      # Worker timeout is 900 s; the visibility timeout must be at least six times that (5400 s).
      VisibilityTimeout: 5400
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobsDeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - { Key: Project, Value: accounts-payable-agent }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: cloudformation }

  JobsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref JobsQueue, !Ref JobsDeadLetterQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: "*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # ------------------------------------------------------------------ logs (short retention)
  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/ap-agent-${Environment}-web"
      RetentionInDays: !Ref LogRetentionDays
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/ap-agent-${Environment}-api"
      RetentionInDays: !Ref LogRetentionDays
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/ap-agent-${Environment}-worker"
      RetentionInDays: !Ref LogRetentionDays
  MigrateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/ap-agent-${Environment}-migrate"
      RetentionInDays: !Ref LogRetentionDays

  # ------------------------------------------------------------------ IAM (least privilege, one role per function)
  WebRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: "sts:AssumeRole" }
      Policies:
        - PolicyName: web
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: ["logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: !Sub "${WebLogGroup.Arn}:*"
              # The ONLY principal allowed to call the IAM-protected API Function URL.
              - Sid: InvokeApiFunctionUrl
                Effect: Allow
                Action: "lambda:InvokeFunctionUrl"
                Resource: !GetAtt ApiFunction.Arn
                Condition:
                  StringEquals:
                    "lambda:FunctionUrlAuthType": AWS_IAM
              - Sid: Secrets
                Effect: Allow
                Action: "ssm:GetParameter"
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/clerk-secret-key"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/frontend-csrf-secret"
      Tags:
        - { Key: Project, Value: accounts-payable-agent }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: cloudformation }

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: "sts:AssumeRole" }
      Policies:
        - PolicyName: api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: ["logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: !Sub "${ApiLogGroup.Arn}:*"
              - Sid: Secrets
                Effect: Allow
                Action: "ssm:GetParameter"
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/postgres-runtime-dsn"
              # Presigns the staged POST, validates and re-commits the object; never lists or reads other prefixes.
              - Sid: InvoiceObjects
                Effect: Allow
                Action: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"]
                Resource:
                  - !Sub "${UploadBucket.Arn}/staging/*"
                  - !Sub "${UploadBucket.Arn}/tenants/*"
              # Without ListBucket S3 answers 403 (not 404) for a missing key, which the store must tell apart.
              - Sid: ExistenceChecks
                Effect: Allow
                Action: "s3:ListBucket"
                Resource: !GetAtt UploadBucket.Arn
              - Sid: Dispatch
                Effect: Allow
                Action: "sqs:SendMessage"
                Resource: !GetAtt JobsQueue.Arn
      Tags:
        - { Key: Project, Value: accounts-payable-agent }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: cloudformation }

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: "sts:AssumeRole" }
      Policies:
        - PolicyName: worker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: ["logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: !Sub "${WorkerLogGroup.Arn}:*"
              - Sid: Secrets
                Effect: Allow
                Action: "ssm:GetParameter"
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/postgres-runtime-dsn"
              # Read-only: processing never writes or deletes source invoices.
              - Sid: ReadInvoices
                Effect: Allow
                Action: "s3:GetObject"
                Resource: !Sub "${UploadBucket.Arn}/tenants/*"
              - Sid: ExistenceChecks
                Effect: Allow
                Action: "s3:ListBucket"
                Resource: !GetAtt UploadBucket.Arn
              - Sid: ConsumeQueue
                Effect: Allow
                Action: ["sqs:ReceiveMessage", "sqs:DeleteMessage", "sqs:GetQueueAttributes", "sqs:ChangeMessageVisibility"]
                Resource: !GetAtt JobsQueue.Arn
      Tags:
        - { Key: Project, Value: accounts-payable-agent }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: cloudformation }

  MigrateRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: "sts:AssumeRole" }
      Policies:
        - PolicyName: migrate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: ["logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: !Sub "${MigrateLogGroup.Arn}:*"
              # The only role that can read the migration/owner DSN.
              - Sid: Secrets
                Effect: Allow
                Action: "ssm:GetParameter"
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/postgres-migration-dsn"
      Tags:
        - { Key: Project, Value: accounts-payable-agent }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: cloudformation }

  # ------------------------------------------------------------------ functions
  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub "ap-agent-${Environment}-api"
      PackageType: Image
      ImageUri: !Ref ApiImageUri
      Role: !GetAtt ApiRole.Arn
      MemorySize: 1024
      Timeout: 30
      ReservedConcurrentExecutions: !If [ReserveWebAndApiConcurrency, !Ref WebAndApiReservedConcurrency, !Ref AWS::NoValue]
      # Only the frontend's execution role may invoke this URL (see WebRole). The browser never calls it.
      FunctionUrlConfig:
        AuthType: AWS_IAM
        InvokeMode: BUFFERED
      Environment:
        Variables:
          AP_AGENT_ENVIRONMENT: hosted
          AP_AGENT_AUTH_MODE: clerk_jwt
          AP_AGENT_PLATFORM_AUTH_MODE: aws_sigv4
          AP_AGENT_ENABLE_OPERATIONS: "true"
          AP_AGENT_ENABLE_REVIEW_COMMAND_WRITES: "true"
          AP_AGENT_ARTIFACT_STORAGE: aws_s3
          AP_AGENT_S3_BUCKET: !Sub "ap-agent-${Environment}-uploads-${AWS::AccountId}-${AWS::Region}"
          AP_AGENT_S3_REGION: !Ref AWS::Region
          AP_AGENT_QUEUE_BACKEND: sqs
          AP_AGENT_SQS_QUEUE_URL: !Ref JobsQueue
          AP_AGENT_CLERK_ISSUER: !Ref ClerkIssuer
          AP_AGENT_CLERK_AUTHORIZED_PARTIES: !Ref FrontendOrigin
          AP_AGENT_API_DISABLE_CONNECTION_POOL: "true"
          AP_AGENT_SSM_PARAMETERS: !Sub "AP_AGENT_POSTGRES_DSN=${SsmPrefix}/postgres-runtime-dsn"

  WebFunction:
    Type: AWS::Serverless::Function
    DependsOn: WebLogGroup
    Properties:
      FunctionName: !Sub "ap-agent-${Environment}-web"
      PackageType: Image
      ImageUri: !Ref WebImageUri
      Role: !GetAtt WebRole.Arn
      MemorySize: 1024
      Timeout: 30
      ReservedConcurrentExecutions: !If [ReserveWebAndApiConcurrency, !Ref WebAndApiReservedConcurrency, !Ref AWS::NoValue]
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
      Environment:
        Variables:
          AP_AGENT_ENVIRONMENT: hosted
          AP_AGENT_FRONTEND_AUTH_MODE: clerk_jwt
          AP_AGENT_FRONTEND_PLATFORM_AUTH_MODE: aws_sigv4
          AP_AGENT_FRONTEND_UPLOAD_MODE: s3_direct
          AP_AGENT_FRONTEND_REVIEW_COMMAND_MODE: commit
          AP_AGENT_FRONTEND_OPERATIONS_MODE: enabled
          AP_AGENT_BACKEND_TIMEOUT_MS: "25000"
          # Server-side only: the IAM-protected API URL is never sent to a browser.
          AP_AGENT_API_BASE_URL: !GetAtt ApiFunctionUrl.FunctionUrl
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: !Ref ClerkPublishableKey
          AP_AGENT_CLERK_AUTHORIZED_PARTIES: !Ref FrontendOrigin
          AP_AGENT_SSM_PARAMETERS: !Sub "CLERK_SECRET_KEY=${SsmPrefix}/clerk-secret-key,AP_AGENT_FRONTEND_CSRF_SECRET=${SsmPrefix}/frontend-csrf-secret"

  # Since late 2025 a public (AuthType NONE) Function URL needs this second statement in addition to InvokeFunctionUrl.
  WebFunctionPublicInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  WorkerFunction:
    Type: AWS::Serverless::Function
    DependsOn: WorkerLogGroup
    Properties:
      FunctionName: !Sub "ap-agent-${Environment}-worker"
      PackageType: Image
      ImageUri: !Ref WorkerImageUri
      Role: !GetAtt WorkerRole.Arn
      MemorySize: !Ref WorkerMemoryMb
      Timeout: 900
      EphemeralStorage:
        Size: !Ref WorkerEphemeralStorageMb
      Environment:
        Variables:
          AP_AGENT_S3_BUCKET: !Sub "ap-agent-${Environment}-uploads-${AWS::AccountId}-${AWS::Region}"
          AP_AGENT_S3_REGION: !Ref AWS::Region
          AP_AGENT_SSM_PARAMETERS: !Sub "AP_AGENT_POSTGRES_DSN=${SsmPrefix}/postgres-runtime-dsn"
      # Single worker WITHOUT reserved concurrency (which would need an account quota of at least 101): every job
      # message uses the one FIFO message group `ap-agent-jobs` (ap_agent.services.job_dispatch.MESSAGE_GROUP_ID), and
      # SQS never delivers a second message of a group while one is in flight, so with BatchSize 1 at most one
      # invocation processes a job at a time. The atomic QUEUED->RUNNING claim is the second guard.
      Events:
        Jobs:
          Type: SQS
          Properties:
            Queue: !GetAtt JobsQueue.Arn
            BatchSize: 1
            Enabled: true
            FunctionResponseTypes: [ReportBatchItemFailures]

  # No Function URL, no event source: invoked only deliberately (aws lambda invoke).
  MigrateFunction:
    Type: AWS::Serverless::Function
    DependsOn: MigrateLogGroup
    Properties:
      FunctionName: !Sub "ap-agent-${Environment}-migrate"
      PackageType: Image
      ImageUri: !Ref MigrateImageUri
      Role: !GetAtt MigrateRole.Arn
      MemorySize: 512
      Timeout: 300
      Environment:
        Variables:
          AP_AGENT_POSTGRES_RUNTIME_ROLE: !Ref PostgresRuntimeRole
          AP_AGENT_SSM_PARAMETERS: !Sub "AP_AGENT_POSTGRES_MIGRATION_DSN=${SsmPrefix}/postgres-migration-dsn"

  # ------------------------------------------------------------------ alarms (conservative)
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "ap-agent-${Environment}-alarms"
      Tags:
        - { Key: Project, Value: accounts-payable-agent }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: cloudformation }

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  DeadLetterQueueNotEmptyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A job message exhausted its retries and sits in the dead-letter queue. Inspect it (runbook).
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt JobsDeadLetterQueue.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  OldestJobMessageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A job message has waited over 30 minutes (worker not running or throttled).
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - { Name: QueueName, Value: !GetAtt JobsQueue.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1800
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  WorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The OCR worker failed (error, timeout or out-of-memory).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref WorkerFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  WorkerDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A worker run took over 12 minutes -- approaching the 15-minute Lambda limit. Raise memory or move to the Fargate fallback.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - { Name: FunctionName, Value: !Ref WorkerFunction }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 720000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Several API invocations failed within five minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref ApiFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  WebErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Several frontend invocations failed within five minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref WebFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  FrontendUrl:
    Description: Public frontend URL (give its origin, without the trailing slash, to the FrontendOrigin parameter on pass 2).
    Value: !GetAtt WebFunctionUrl.FunctionUrl
  ApiUrl:
    Description: IAM-protected API URL (SigV4 only; never exposed to the browser).
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  UploadBucketName:
    Value: !Ref UploadBucket
  QueueUrl:
    Value: !Ref JobsQueue
  DeadLetterQueueUrl:
    Value: !Ref JobsDeadLetterQueue
  WorkerFunctionArn:
    Value: !GetAtt WorkerFunction.Arn
  MigrationFunctionArn:
    Value: !GetAtt MigrateFunction.Arn
  AlarmTopicArn:
    Value: !Ref AlarmTopic
